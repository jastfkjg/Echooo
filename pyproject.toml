[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echooo"
version = "0.2.0"
description = "A personal voice representative with scoped knowledge and delegated authority"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<17",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
