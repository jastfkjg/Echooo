# Local PostgreSQL helper; the FastAPI application runs from the repository.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: echooo
      POSTGRES_DB: echooo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - echooo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echooo -d echooo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  echooo_postgres:
